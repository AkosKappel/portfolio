name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Vercel builds and deploys on its own; this workflow only guards quality. The jobs run in
# parallel, and each one rebuilds because the build is faster than passing `.next` around.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/

  # Desktop Lighthouse: performance 90, accessibility, best practices and SEO 100,
  # and at most 300 KB of compressed JavaScript per page. Mobile Lighthouse only reports
  # (performance below 90 is a warning) until the mobile scores reach the budget.
  # The pages are split into shards that override the URL list in the config.
  lighthouse:
    name: lighthouse (${{ matrix.form }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - form: desktop
            shard: 1
            config: lighthouserc.json
            pages: / /projects /projects/modern-fashion-store
          - form: desktop
            shard: 2
            config: lighthouserc.json
            pages: /experience /about /cv/pdf
          - form: mobile
            shard: 1
            config: lighthouserc.mobile.json
            pages: / /projects /activity
          - form: mobile
            shard: 2
            config: lighthouserc.mobile.json
            pages: /projects/modern-fashion-store /experience /about
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: npm run lighthouse
        run: |
          urls=()
          for page in ${{ matrix.pages }}; do urls+=("--collect.url=http://localhost:3400$page"); done
          npm run lighthouse -- --config=${{ matrix.config }} "${urls[@]}"
      - name: Summarize the median runs
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Lighthouse ${{ matrix.form }} ${{ matrix.shard }}"
            echo "| Page | Performance | LCP | TBT | CLS |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | select(.isRepresentativeRun) | .jsonPath' lighthouse-report/manifest.json |
              xargs -I{} jq -r '"| \(.finalDisplayedUrl | sub("http://localhost:3400"; "")) | \(.categories.performance.score * 100 | round) | \(.audits["largest-contentful-paint"].displayValue) | \(.audits["total-blocking-time"].displayValue) | \(.audits["cumulative-layout-shift"].displayValue) |"' {}
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report-${{ matrix.form }}-${{ matrix.shard }}
          path: lighthouse-report/
