name: Links

# External sites go down on their own schedule, so this runs weekly and on demand
# instead of blocking pushes. A broken link only warns, since the fix is usually on the other site.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:links || echo "::warning title=Broken external links::Some external links failed; see the test output for which ones."
